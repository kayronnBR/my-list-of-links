<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #ffffff;
            margin: 0;
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
        }

        h2 { text-align: center; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }
        
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }

        input { 
            padding: 14px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            outline: none; 
            background: #111;
            color: #fff;
        }

        button#add-btn { 
            padding: 14px; 
            background-color: #ffffff; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .link-item {
            border-bottom: 1px solid #222; 
            padding: 18px 5px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }

        .link-text {
            cursor: pointer;
            flex-grow: 1;
            font-size: 16px;
            color: #ccc;
            transition: color 0.2s;
        }

        .link-text:hover { color: #ffffff; }

        /* Botão de Remover com estados */
        .btn-delete { 
            background: #1a1a1a; 
            color: #555; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 4px;
            cursor: pointer; 
            font-size: 11px; 
            transition: all 0.3s;
            min-width: 80px;
        }

        .btn-delete.confirmar {
            background: #ff4444;
            color: white;
        }

        .copiado { color: #00ff88 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>LINKS PRIVADOS</h2>
    <h6 style="color: #FF404040;">localStorage.setItem('linksSeguros', 'ColeAqui');</h6>
    <a href="https://odysee.com/backup-e-restaura%C3%A7%C3%A3o-dos-seus-links:bf5a246c509c930638b4f7a08f62e300aac404e1" 
   target="_blank" 
   style="display: inline-block; padding: 10px 20px; background-color: #ef194b; color: white; text-decoration: none; border-radius: 5px; font-family: sans-serif; font-weight: bold;">
   backup e restauração dos seus links
</a>

    <div class="form-group">
        <input type="text" id="nomeLink" placeholder="Nome do Link">
        <input type="text" id="urlLink" placeholder="URL para copiar">
        <button id="add-btn">SALVAR</button>
    </div>

    <div id="lista-links"></div>
</div>

<script>
    const btnAdd = document.getElementById('add-btn');
    const listaDiv = document.getElementById('lista-links');

    document.addEventListener('DOMContentLoaded', carregarLinks);

    function carregarLinks() {
        const linksSalvos = JSON.parse(localStorage.getItem('linksSeguros')) || [];
        listaDiv.innerHTML = '';
        linksSalvos.forEach((link, index) => renderizarLink(link.nome, link.url, index));
    }

    function renderizarLink(nome, url, index) {
        const item = document.createElement('div');
        item.className = 'link-item';
        
        // Criar o texto do link
        const txt = document.createElement('div');
        txt.className = 'link-text';
        txt.innerText = nome;
        txt.onclick = () => copiarLink(url, txt);

        // Criar o botão de remover com trava de segurança
        const btn = document.createElement('button');
        btn.className = 'btn-delete';
        btn.innerText = 'Remover';
        
        let cliqueConfirmacao = false;
        let timer;

        btn.onclick = () => {
            if (!cliqueConfirmacao) {
                // Primeiro clique
                cliqueConfirmacao = true;
                btn.innerText = 'Certeza?';
                btn.classList.add('confirmar');
                
                // Se não clicar de novo em 3 segundos, cancela
                timer = setTimeout(() => {
                    cliqueConfirmacao = false;
                    btn.innerText = 'Remover';
                    btn.classList.remove('confirmar');
                }, 3000);
            } else {
                // Segundo clique (Confirmado)
                clearTimeout(timer);
                deletarLink(index);
            }
        };

        item.appendChild(txt);
        item.appendChild(btn);
        listaDiv.appendChild(item);
    }

    btnAdd.onclick = function() {
        const nome = document.getElementById('nomeLink').value.trim();
        const url = document.getElementById('urlLink').value.trim();
        if (nome && url) {
            const links = JSON.parse(localStorage.getItem('linksSeguros')) || [];
            links.push({ nome, url });
            localStorage.setItem('linksSeguros', JSON.stringify(links));
            document.getElementById('nomeLink').value = '';
            document.getElementById('urlLink').value = '';
            carregarLinks();
        }
    };

    function copiarLink(url, elemento) {
        navigator.clipboard.writeText(url).then(() => {
            const original = elemento.innerText;
            elemento.innerText = "✓ Copiado";
            elemento.classList.add('copiado');
            setTimeout(() => {
                elemento.innerText = original;
                elemento.classList.remove('copiado');
            }, 800);
        });
    }

    function deletarLink(index) {
        let links = JSON.parse(localStorage.getItem('linksSeguros'));
        links.splice(index, 1);
        localStorage.setItem('linksSeguros', JSON.stringify(links));
        carregarLinks();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
